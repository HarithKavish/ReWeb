[versions]
agp = "8.5.2"
kotlin = "1.9.24"

# All AndroidX versions below are pinned to the newest release that still
# supports minSdk 21. Raising any of these must be checked against that floor.
appcompat = "1.6.1"
recyclerview = "1.3.2"
browser = "1.8.0"
webkit = "1.8.0"
media = "1.7.0"
junit = "4.13.2"
robolectric = "4.12.2"
androidx-test-core = "1.5.0"
androidx-test-junit = "1.1.5"
espresso = "3.5.1"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-core" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

name: Release

# Deliberately NOT triggered by v* tags. publish-store.yml creates those tags,
# and a second workflow racing it on the same tag would re-run action-gh-release
# against an existing release - potentially replacing a signed store build with
# an unsigned one. This workflow is for manual inspection builds only; the store
# is published from publish-store.yml.
on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Attach the APK to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signing is optional. When the secrets are absent the release APK is still
      # built, just unsigned — see the summary written below and BUILD.md.
      - name: Decode signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] \
             || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured; the APK will be UNSIGNED and cannot be installed without further signing."
            {
              echo "### Unsigned release build"
              echo ""
              echo "No signing secrets were found, so this APK is **unsigned** and Android will refuse to install it."
              echo ""
              echo "To produce an installable release, add these repository secrets:"
              echo ""
              echo '| Secret | Contents |'
              echo '|--------|----------|'
              echo '| `ANDROID_KEYSTORE_BASE64` | base64 of your `.jks` keystore |'
              echo '| `ANDROID_KEYSTORE_PASSWORD` | keystore password |'
              echo '| `ANDROID_KEY_ALIAS` | key alias |'
              echo '| `ANDROID_KEY_PASSWORD` | key password |'
              echo ""
              echo "See BUILD.md for how to generate a keystore."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          # Fail loudly rather than building something unsigned by accident.
          if [ ! -s "${RUNNER_TEMP}/release.jks" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a usable keystore."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Release signing is configured."

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Report APK size
        run: ./gradlew reportApkSize --no-daemon

      - name: Locate APK
        id: locate
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was produced under app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p artifacts
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp "$APK_PATH" artifacts/reweb-release.apk
            echo "apk_name=reweb-release.apk" >> "$GITHUB_OUTPUT"
          else
            # Naming makes the limitation obvious to whoever downloads it.
            cp "$APK_PATH" artifacts/reweb-release-unsigned.apk
            echo "apk_name=reweb-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts/

      - name: Delete decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: reweb-release-apk
          path: artifacts/${{ steps.locate.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reweb-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.locate.outputs.apk_name }}
          draft: true
          body: |
            ReWeb ${{ github.ref_name }}

            Signed: ${{ steps.signing.outputs.signed == 'true' && 'yes' || 'NO — this APK is unsigned and will not install' }}

            See COMPATIBILITY.md for what does and does not work on legacy Android.
